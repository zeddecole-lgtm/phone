name: Build APK

on:
  push:
    branches: [ main, 'fix/**' ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'gradle'

      - name: Test actual account proxy Java contracts
        run: |
          set -o pipefail
          python3 tools/test_account_proxy_contract.py \
            Bcore/src/main/java/top/niunaijun/blackbox/fake/service/IAccountManagerProxy.java \
            Bcore/src/main/java/top/niunaijun/blackbox/fake/frameworks/BAccountManager.java \
            | tee account-proxy-contract-results.txt

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Grant execute permission for gradlew
        run: chmod +x ./gradlew

      - name: Test Android library authentication registry
        run: ./gradlew :Bcore:testDebugUnitTest --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload test evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: HiddenBox-test-results
          path: |
            account-proxy-contract-results.txt
            Bcore/build/test-results/testDebugUnitTest/*.xml
            Bcore/build/reports/tests/testDebugUnitTest/
          if-no-files-found: warn

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: HiddenBox-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
